packages:
  - "."

# Security overrides — force patched versions of transitive (build/dev-time)
# deps flagged by `pnpm audit` (high severity). None ship to the browser; all
# are dev/build tooling. Scoped to the vulnerable ranges so healthy versions
# already in the tree are left untouched. Re-run `pnpm audit --audit-level high`
# after touching this list.
overrides:
  # js-yaml — quadratic-DoS in merge keys; both the 3.x and 4.x lines need a patch.
  "js-yaml@>=3.0.0 <3.15.1": "3.15.1"
  "js-yaml@>=4.0.0 <4.3.1": "4.3.1"
  "yaml@>=2.0.0 <2.8.3": "2.8.3" # stack-overflow on nested collections (via @astrojs/check)
  "brace-expansion@<5.0.9": "5.0.9" # exponential-time expansion DoS (via eslint, glob → minimatch)
  "shell-quote@<1.8.5": "1.10.0" # quadratic-complexity DoS in parse() (via concurrently)
  "svgo@>=4.0.0 <4.0.2": "4.0.2" # removeScripts leaves executable scripts (via astro)
  "fast-uri@<3.1.5": "3.1.5" # host confusion via backslash authority delimiter
  "undici@>=7.0.0 <7.29.0": "7.29.0" # request smuggling / DoS
  "nanoid@<3.3.17": "3.3.17" # predictable output advisory (via astro)
  "postcss@<8.5.26": "8.5.26" # parsing DoS (via tailwindcss / vite)
  "sharp@<0.35.0": "0.35.3" # dedupe the stale transitive 0.34.5 onto our patched direct

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - '@astrojs/markdown-satteri@0.3.1'
  - '@astrojs/mdx@7.0.0'
  - '@astrojs/react@6.0.0'
  - astro@7.0.0
  - node-html-parser@8.0.3
