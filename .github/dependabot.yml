version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Match pnpm's minimumReleaseAge supply-chain guard (pnpm-workspace.yaml):
    # don't propose freshly-published versions that a frozen install would reject.
    cooldown:
      default-days: 7
    ignore:
      # @astrojs/check (language-server) crashes on TypeScript 7's tsconfig API
      # (`astro check` → "Cannot read properties of undefined (reading
      # 'fileExists')"). Hold typescript at 6.x until upstream supports TS7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      dev-deps:
        dependency-type: "development"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ci"
