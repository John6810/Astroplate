name: Dependabot auto-merge

# Auto-merges Dependabot PRs once every required check passes. Safe because
# branch protection gates the merge on the full check suite (Build & type
# check incl. the CSP hash guard, Dependency audit, gitleaks, Trivy). Major
# version bumps are deliberately left for manual review — CI can pass while a
# major still carries behavioural surprises.
on: pull_request_target

# pull_request_target runs in the base-branch context, so the token has write
# access even for Dependabot-authored PRs (a plain pull_request event would not).
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch and minor updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
